name: prep404
description: "Prep404 - Next-Generation Gamified Competitive Exam & Socratic AI Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation & Architecture
  go_router: ^14.2.0
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # UI, Math & Animations
  flutter_math_fork: ^0.7.2     # High-performance native KaTeX rendering
  google_fonts: ^6.2.1          # Anek Bangla, Noto Sans, Inter
  confetti: ^0.7.0              # Victory celebration confetti

  # Networking & Sockets
  http: ^1.2.1
  web_socket_channel: ^3.0.0    # Real-time PvP battle connection

  # Persistence & Caching
  supabase_flutter: ^2.8.0
  url_launcher: ^6.3.3
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  google_sign_in: ^7.2.0
  flutter_dotenv: ^6.0.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  rive: ^0.14.11
  lottie: ^3.8.2
  flutter_animate: ^4.5.2
  flutter_staggered_animations: ^1.1.1
  shimmer: ^4.0.0
  animations: ^3.0.0
  sensors_plus: ^7.1.1

  # Printable OMR Practice Packs (PDF + QR Code Scanner)
  pdf: ^3.11.1
  printing: ^5.13.4
  mobile_scanner: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  path_provider_android: 2.2.23
  shared_preferences_android: 2.5.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/images/brand/
    - assets/animations/
  shaders:
    - shaders/aurora_mesh.frag
    - shaders/liquid_fluid.frag
